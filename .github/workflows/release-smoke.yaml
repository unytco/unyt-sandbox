name: "release-smoke"

# Does the artifact a release shipped actually work on a user's machine?
#
# Everything runs in PRISTINE distro containers, not on the runner — the matrix
# is one named list in scripts/smoke/run-smoke.sh, spanning both the oldest
# supported glibc and the current stables. A GitHub runner is a build image carrying
# hundreds of preinstalled libraries, so a package that under-declares its
# dependencies installs and runs there while a real user's machine fails — the
# exact bug class this exists to catch would be invisible. Containers are both
# more faithful and runnable on a laptop, so the whole thing iterates locally:
#
#   scripts/smoke/run-smoke.sh <artifact.deb>
#
# The checks themselves live in scripts/smoke/ and are documented there.
on:
  workflow_dispatch:
    inputs:
      release:
        description: "Release id (e.g. 368727714) or tag (e.g. v0.100.0)"
        required: true
        type: string
  workflow_call:
    inputs:
      release:
        required: true
        type: string

# macOS and Windows are separate lanes: neither has an equivalent of dpkg's
# dependency metadata, so they need their own answer rather than a matrix row.
jobs:
  linux:
    name: "linux install smoke"
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GIT_PAT }}
          fetch-depth: 1

      # First, and outside the containers: <1s, no Docker, and it guards the
      # oracle every other check depends on. Three invocation bugs have shipped
      # in that oracle, each of which made an assertion incapable of failing — a
      # regression test nothing runs is a regression test you do not have.
      - name: Oracle regression test
        run: bash scripts/smoke/test-oracle.sh

      - name: Download the released Linux artifacts
        id: download
        env:
          GH_TOKEN: ${{ secrets.GIT_PAT }}
        run: |
          deb="$(bash scripts/smoke/download-release-asset.sh \
            "${{ inputs.release }}" linux.deb "$RUNNER_TEMP/artifacts")"
          appimage="$(bash scripts/smoke/download-release-asset.sh \
            "${{ inputs.release }}" linux.AppImage "$RUNNER_TEMP/artifacts")"
          echo "deb=$deb" >> "$GITHUB_OUTPUT"
          echo "appimage=$appimage" >> "$GITHUB_OUTPUT"

      # Docker is preinstalled on the ubuntu runners; the containers are what the
      # checks actually run in, so the runner's own image never matters. Both
      # Linux bundles are smoked — they fail differently, and the AppImage is the
      # one prone to over-bundling (see scripts/smoke/check-appimage.sh).
      - name: Run the smoke in pristine containers
        id: smoke
        continue-on-error: true
        run: |
          # Redirect the whole loop rather than piping it: a pipeline runs in a
          # subshell and `rc` set inside it would be lost, so every failure would
          # report as success.
          rc=0
          for artifact in "${{ steps.download.outputs.deb }}" "${{ steps.download.outputs.appimage }}"; do
            echo "##### $(basename "$artifact") #####"
            bash scripts/smoke/run-smoke.sh "$artifact" || rc=1
          done >"$RUNNER_TEMP/smoke.log" 2>&1
          cat "$RUNNER_TEMP/smoke.log"
          exit "$rc"

      - name: Summary
        if: ${{ !cancelled() }}
        env:
          SMOKE: ${{ steps.smoke.outcome || 'did not run' }}
        run: |
          {
            echo "### Release smoke — \`${{ inputs.release }}\`"
            echo ""
            echo '```'
            # Only the result rows, never `/^# summary/,$p` — with two artifacts
            # in one log that range runs from the first summary to EOF and drags
            # the entire second run in with it. $GITHUB_STEP_SUMMARY caps at 1 MB
            # and overflowing fails the step, so bound it here and keep the full
            # output in the artifact.
            grep -E '^(#####|IMAGE|ubuntu|debian|All checks)' "$RUNNER_TEMP/smoke.log" 2>/dev/null | head -100 \
              || echo "(no summary — the run did not get that far)"
            echo '```'
            echo ""
            echo "This job goes red when a check fails, but nothing \`needs\` it, so it never blocks or unpublishes a release. Full output is in the \`release-smoke-log\` artifact."
          } >> "$GITHUB_STEP_SUMMARY"

          # Annotate, so a report-only failure is visible on the run page without
          # anyone opening the summary of a green job.
          if [ "$SMOKE" != success ]; then
            echo "::error title=Release smoke failed::see the job summary for which check failed on which distro"
          fi

      - name: Upload the smoke log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-smoke-log
          path: ${{ runner.temp }}/smoke.log
          if-no-files-found: warn

      # The job CONCLUDES FAILURE whenever a check failed. Non-blocking is a
      # STRUCTURAL property here — nothing `needs` this job, so its failure
      # cannot stop or unpublish a release — deliberately not a flag: a green
      # check indistinguishable from a real pass is how a broken smoke goes
      # unread, and a knob that reads as behaviour invites someone to flip it
      # and believe something changed.
      - name: Fail on a failed check
        if: ${{ !cancelled() }}
        run: '[ "${{ steps.smoke.outcome }}" = success ]'
