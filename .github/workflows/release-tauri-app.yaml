name: "release-tauri-app"
on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
      # A throwaway build that proves the pipeline. Never something a user installs.
      - "v[0-9]+.[0-9]+.[0-9]+-dev.*"

# One run per tag at a time: two would replace each other's builds on the one release.
concurrency:
  group: release-tauri-app-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish-happ:
    name: Stage 1 - publish happ
    permissions:
      contents: write
    runs-on: ubuntu-22.04
    outputs:
      releaseId: ${{ steps.create-release.outputs.id }}
      appVersion: ${{ steps.version.outputs.APP_VERSION }}
      productName: ${{ steps.product.outputs.name }}
      msiVersion: ${{ steps.msi.outputs.MSI_VERSION }}
      signedUpdates: ${{ steps.updater.outputs.enabled }}
      updaterPubkey: ${{ steps.updater.outputs.pubkey }}
      startedAt: ${{ steps.start.outputs.at }}
      happSha256: ${{ steps.happ.outputs.sha256 }}
    steps:
      - name: Note when this run started
        id: start
        run: echo "at=$(date +%s)" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ secrets.GIT_PAT }}
          persist-credentials: false
          submodules: recursive
          # Full history: a UI release diffs the parent tag's submodule pointer.
          fetch-depth: 0

      - name: Install nix
        uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
        with:
          github_access_token: ${{ secrets.GIT_PAT }}
          nix_path: nixpkgs=channel:nixos-26.05

      - uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
        with:
          name: holochain-ci
          extraPullNames: darksoil-studio

      - name: Assert version contract (tag == src-tauri Cargo.toml == tauri.conf.json)
        id: version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          APP_VERSION="$(bash scripts/check-version-contract.sh "$TAG")"
          echo "APP_VERSION=$APP_VERSION" >> "$GITHUB_OUTPUT"

      - name: Read the product name
        id: product
        run: |
          name="$(jq -er .productName unyt/src-tauri/tauri.conf.json)"
          echo "name=$name" >> "$GITHUB_OUTPUT"

      # The smoke runs without the submodule, so it carries the identifier as a constant.
      - name: The smoke looks for the pinned app's identifier
        run: |
          . scripts/smoke/common.sh
          identifier="$(jq -er .identifier unyt/src-tauri/tauri.conf.json)"
          if [ "$UNYT_BUNDLE_ID" != "$identifier" ]; then
            echo "::error::scripts/smoke/common.sh has UNYT_BUNDLE_ID=$UNYT_BUNDLE_ID, but the pinned app is $identifier"
            exit 1
          fi

      - name: Decide whether this release signs its updates
        id: updater
        run: bash scripts/updater-signing.sh unyt/src-tauri/tauri.conf.json >> "$GITHUB_OUTPUT"

      - name: The release names each updater asset as the app expects
        if: steps.updater.outputs.enabled == 'true'
        run: bash scripts/updater-asset-names.sh unyt/src-tauri/src/updater.rs

      - name: Resolve release kind (tag patch → migration | UI)
        id: kind
        env:
          TAG: ${{ github.ref_name }}
        run: bash scripts/release-kind.sh "$TAG" >> "$GITHUB_OUTPUT"

      # Here, not in the Windows job: a tag the msi cannot carry then fails in seconds rather
      # than after yarn install, the happ download and three other platforms building.
      - name: Derive and self-test the MSI product version
        id: msi
        env:
          APP_VERSION: ${{ steps.version.outputs.APP_VERSION }}
        run: |
          bash scripts/msi-version.sh --self-test
          msi="$(bash scripts/msi-version.sh "$APP_VERSION")"
          echo "msi product version: ${msi:-none — a stable build, tauri derives its own}"
          echo "MSI_VERSION=$msi" >> "$GITHUB_OUTPUT"

      - name: Build DNA + happ (migration release, vM.m.0)
        if: steps.kind.outputs.kind == 'migration'
        run: |
          cd unyt && nix develop --no-update-lock-file --accept-flake-config --command bash -c "make package"

      - name: Build unyt_cli
        if: steps.kind.outputs.kind == 'migration'
        run: |
          cd unyt/
          cargo build -p unyt_cli --release --locked

      - name: Inherit lineage happ + repack UI (UI release, vM.m.p)
        if: steps.kind.outputs.kind == 'ui'
        env:
          GH_TOKEN: ${{ secrets.GIT_PAT }}
          TAG: ${{ github.ref_name }}
          PARENT_TAG: ${{ steps.kind.outputs.parent_tag }}
        run: bash scripts/inherit-ui-release.sh "$TAG" "$PARENT_TAG"

      - name: Get Changelog Content
        id: changelog
        # Through env, not interpolated into the script: a tag is attacker-shaped input
        # and `${{ }}` would splice it into the shell before bash ever sees a quote.
        env:
          APP_VERSION: ${{ steps.version.outputs.APP_VERSION }}
        run: |
          awk -v ver="$APP_VERSION" '
            $0 ~ "^## \\[" ver "\\]" {p=1; next}
            p && /^## \[/ {exit}
            p {print}
          ' unyt/CHANGELOG.md > release_notes.txt
          {
            echo "notes<<EOF"
            cat release_notes.txt
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      # The build jobs take the happ from the release, which can be edited once this uploads it.
      - name: Note the happ the builds compile in
        id: happ
        run: |
          sum="$(sha256sum <unyt/workdir/unyt.happ)"
          echo "sha256=${sum%% *}" >> "$GITHUB_OUTPUT"

      - id: create-release
        uses: ncipollo/release-action@339a81892b84b4eeb0f6e744e4574d79d0d9b8dd # v1.21.0
        with:
          allowUpdates: true
          artifactErrorsFailBuild: true
          artifacts: |
            unyt/workdir/unyt.happ
            unyt/workdir/unyt.webhapp
            unyt/dnas/alliance/workdir/alliance.dna
            unyt/target/release/unyt_cli
          body: ${{ steps.changelog.outputs.notes }}
          # The pushed tag, not APP_VERSION: a -dev.* must not ship as stable.
          name: ${{ steps.product.outputs.name }} ${{ github.ref_name }}
          tag: ${{ github.ref_name }}
          prerelease: true
          draft: true

  release-tauri-app:
    name: Stage 2 - release tauri apps (${{ matrix.config.label }})
    needs: publish-happ
    strategy:
      fail-fast: false
      matrix:
        config:
          # macos-latest ON PURPOSE, and the one runner label in this repo that
          # is meant to roll: the smoke's gates are pinned to macos-15 /
          # macos-15-intel, so the artifact is BUILT on a newer macOS than it is
          # installed on. Pinning these two legs changes what users install, so
          # test-oracle.sh fails on a pin here.
          - platform: macos-latest
            args: "--target aarch64-apple-darwin"
            arc_factor: default
            label: macos-arm64
          - platform: macos-latest
            args: "--target x86_64-apple-darwin"
            arc_factor: default
            label: macos-x64
          - platform: ubuntu-22.04
            args: "--bundles deb,appimage"
            arc_factor: default
            label: linux
          - platform: windows-latest
            args: ""
            arc_factor: default
            label: windows
          # THE SAME FOUR PLATFORMS AT ARC 0: a node that gossips and validates
          # but stores no shard of the DHT. Stage 3 smokes the default-arc set
          # only, so these ship unsmoked. release-inventory.sh carries why.
          - platform: macos-latest
            args: "--target aarch64-apple-darwin"
            arc_factor: zero
            label: macos-arm64 zero-arc
          - platform: macos-latest
            args: "--target x86_64-apple-darwin"
            arc_factor: zero
            label: macos-x64 zero-arc
          - platform: ubuntu-22.04
            args: "--bundles deb,appimage"
            arc_factor: zero
            label: linux zero-arc
          - platform: windows-latest
            args: ""
            arc_factor: zero
            label: windows zero-arc
    env:
      MACOSX_DEPLOYMENT_TARGET: 10.13
      HOLOCHAIN_ARC_FACTOR: ${{ matrix.config.arc_factor != 'default' &&
        matrix.config.arc_factor || '' }}
      CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "16"
      CARGO_PROFILE_RELEASE_LTO: "false"
      # Empty means the shipped app can never check for updates. Not a secret.
      VITE_MIGRATION_SERVICE_URL: https://migration.unyt.dev
    # Release assets move through GIT_PAT, so this job's token only reads.
    permissions:
      contents: read

    runs-on: ${{ matrix.config.platform }}
    steps:
      - name: Support longpaths
        if: matrix.config.platform != 'ubuntu-22.04'
        run: git config --system core.longpaths true

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          token: ${{ secrets.GIT_PAT }}
          persist-credentials: false
          submodules: recursive
          fetch-depth: 1

      - name: setup node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.23.3

      - name: install Rust 1.95.0
        # A floor: holochain 0.7.0 needs `cfg_select!`, stabilised in 1.95.
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: 1.95.0

      - name: install x86_64 target
        if: matrix.config.args == '--target x86_64-apple-darwin'
        run: rustup target add x86_64-apple-darwin

      - name: install dependencies (ubuntu only)
        if: matrix.config.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.0-dev \
            build-essential \
            curl \
            wget \
            file \
            libssl-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            javascriptcoregtk-4.1 \
            libsoup-3.0 \
            webkit2gtk-4.1

      - name: Install jq on Windows
        if: runner.os == 'Windows'
        run: choco install -y jq

      - name: Install and prepare
        working-directory: unyt
        # --ignore-engines: hc-spin wants node >=24; yarn aborts the whole
        # install otherwise. Node 22 is the app's floor, not an oversight.
        run: |
          yarn install --frozen-lockfile --ignore-engines

      - name: Download release of the .happ
        uses: robinraju/release-downloader@c39a3b234af58f0cf85888573d361fb6fa281534 # v1.10
        env:
          GITHUB_TOKEN: ${{ secrets.GIT_PAT }}
        with:
          token: ${{ secrets.GIT_PAT }}
          releaseId: ${{ needs.publish-happ.outputs.releaseId }}
          fileName: "unyt.happ"
          out-file-path: "unyt/workdir/"

      - name: Check the happ is the one stage 1 published
        shell: bash
        env:
          HAPP_SHA256: ${{ needs.publish-happ.outputs.happSha256 }}
        run: bash scripts/check-sha256.sh unyt/workdir/unyt.happ "$HAPP_SHA256"

      - name: Assert migration-service URL is set (no silently un-updatable build)
        shell: bash
        run: |
          [ -n "$VITE_MIGRATION_SERVICE_URL" ] || {
            echo "::error::VITE_MIGRATION_SERVICE_URL is empty — a shipped build without it can never check for updates (both channels short-circuit to 'unreachable')."
            exit 1
          }

      - name: Pin the MSI product version
        # Written here, never committed: a wix.version in tauri.conf.json would
        # outlive the release that set it. Empty means a stable build, which
        # tauri versions itself.
        if: runner.os == 'Windows' && needs.publish-happ.outputs.msiVersion != ''
        shell: bash
        env:
          MSI_VERSION: ${{ needs.publish-happ.outputs.msiVersion }}
        run: |
          conf=unyt/src-tauri/tauri.conf.json
          jq --arg v "$MSI_VERSION" '.bundle.windows.wix.version = $v' "$conf" >"$conf.tmp"
          mv "$conf.tmp" "$conf"

      - name: Turn on signed updater artifacts
        # Written here, never committed: the bundler refuses to build without the signing key once
        # this is on, and no local build holds it.
        if: needs.publish-happ.outputs.signedUpdates == 'true'
        shell: bash
        run: |
          conf=unyt/src-tauri/tauri.conf.json
          jq '.bundle.createUpdaterArtifacts = true' "$conf" >"$conf.tmp"
          mv "$conf.tmp" "$conf"

      - name: Sign the build with a key that dies with this job
        # Nothing trusts the bundler's signature: updater-manifests signs every artifact again with the
        # release key, against this job's record. So no build script ever runs beside the release key.
        if: needs.publish-happ.outputs.signedUpdates == 'true'
        shell: bash
        working-directory: unyt
        run: |
          password="$(openssl rand -hex 32)"
          echo "::add-mask::$password"
          yarn --silent tauri signer generate --ci -p "$password" -w "$RUNNER_TEMP/build-signing.key" >/dev/null
          {
            echo "TAURI_SIGNING_PRIVATE_KEY=$(cat "$RUNNER_TEMP/build-signing.key")"
            echo "TAURI_SIGNING_PRIVATE_KEY_PASSWORD=$password"
          } >>"$GITHUB_ENV"

      - name: Free disk before the build (linux)
        # The number to size a fix from when this ENOSPCs. No RUSTFLAGS strip alongside it:
        # that changes the binary users get, not just what CI costs.
        if: matrix.config.platform == 'ubuntu-22.04'
        run: df -h /

      - name: build (${{ matrix.config.arc_factor }} arc)
        id: build
        uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # v0.6.2
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_DEV_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID_EMAIL }}
          APPLE_PASSWORD: ${{ secrets.APPLE_ID_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          GITHUB_TOKEN: ${{ secrets.GIT_PAT }}
          VITE_COMMIT_SHA: ${{ needs.publish-happ.outputs.productName }}-${{
            needs.publish-happ.outputs.appVersion }}-${{ matrix.config.arc_factor }}-arc
          APP_VERSION: ${{ needs.publish-happ.outputs.appVersion }}
          HOLOCHAIN_ARC_FACTOR: ${{ matrix.config.arc_factor != 'default' &&
            matrix.config.arc_factor || '' }}
          UNYT_JOINING_SERVICE_URL: https://joining.unyt.dev
          VITE_MIGRATION_SERVICE_URL: ${{ env.VITE_MIGRATION_SERVICE_URL }}
        with:
          projectPath: unyt
          releaseId: ${{ needs.publish-happ.outputs.releaseId }}
          releaseDraft: true
          prerelease: true
          args: ${{ matrix.config.args }}
          # updater-manifests below writes one per arc factor instead.
          includeUpdaterJson: false
          assetNamePattern: ${{
            format('unyt_[version]_[name]_{0}-arc_[arch]_[platform][ext]',
            matrix.config.arc_factor) }}

      # A run artifact, not a release asset, so editing the release cannot change it.
      - name: Record what this build published
        if: needs.publish-happ.outputs.signedUpdates == 'true'
        shell: bash
        env:
          ARC_FACTOR: ${{ matrix.config.arc_factor }}
          BUILD_ARGS: ${{ matrix.config.args }}
          ARTIFACT_PATHS: ${{ steps.build.outputs.artifactPaths }}
        run: |
          bash scripts/updater-provenance.sh unyt/src-tauri/tauri.conf.json \
            "$ARC_FACTOR" "$BUILD_ARGS" "$ARTIFACT_PATHS" >updater-provenance.sha256

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: needs.publish-happ.outputs.signedUpdates == 'true'
        with:
          name: updater-provenance-${{ strategy.job-index }}
          path: updater-provenance.sha256
          if-no-files-found: error

      - name: Free disk when the job ends (linux)
        if: always() && matrix.config.platform == 'ubuntu-22.04'
        run: df -h /

  updater-manifests:
    name: "Stage 2: updater manifests"
    needs: [publish-happ, release-tauri-app]
    # Past a failed build too, so the platform it left unsigned is named rather than skipped.
    if: ${{ !cancelled() && needs.publish-happ.outputs.signedUpdates == 'true' }}
    # The one job that holds the release key: its secrets live in this environment alone.
    environment: release
    permissions:
      contents: write
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Install minisign
        run: bash scripts/install-minisign.sh

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.23.3

      - name: Install the signer
        run: npm ci --prefix scripts/tauri-signer --ignore-scripts --no-audit --no-fund

      - name: Download the updater artifacts and their build signatures
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          mkdir assets
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern '*.sig' --dir assets
          for sig in assets/*.sig; do
            gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir assets \
              --pattern "$(basename "$sig" .sig)"
          done

      - name: Download what each build recorded publishing
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: updater-provenance-*
          path: provenance

      - name: Sign them under their asset names
        env:
          APP_VERSION: ${{ needs.publish-happ.outputs.appVersion }}
          STARTED_AT: ${{ needs.publish-happ.outputs.startedAt }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          cat provenance/*/updater-provenance.sha256 >updater-provenance.sha256
          bash scripts/updater-sign.sh "$APP_VERSION" assets "$STARTED_AT" updater-provenance.sha256

      # SHA256SUMS comes from the build records, not the release, so it names the bytes each build made.
      - name: Publish them with one manifest per arc factor, and SHA256SUMS
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          APP_VERSION: ${{ needs.publish-happ.outputs.appVersion }}
          PUBKEY: ${{ needs.publish-happ.outputs.updaterPubkey }}
        run: |
          mkdir manifests
          bash scripts/updater-manifests.sh "$TAG" "$APP_VERSION" "$PUBKEY" assets manifests
          sort -k2,2 updater-provenance.sha256 >manifests/SHA256SUMS
          gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" --clobber assets/*.sig manifests/*

  # A FAILED PHASE-1 LANE FAILS THIS RUN. The release is created draft and a
  # human publishes it, so the run's colour is what tells them. Phase 2 keeps the
  # advisory behaviour it has always had here.
  #
  # Nothing `needs` this job either way. Not `workflow_run` — that only fires on
  # the default branch.
  smoke-test:
    # JUST THE STAGE: GitHub prefixes every called job with this one, so anything
    # said here is said again on all 16 lines of the Checks list.
    name: Stage 3
    # After the signing, and never after it failed: the smoke runs the release's installers, which could
    # replace the build records the signing trusts. A release whose signing failed is re-tagged, not
    # re-run.
    needs: [publish-happ, release-tauri-app, updater-manifests]
    # Not gated on the build job: one failed row would suppress every lane. Where the release signs its
    # updates, a failed row fails the signing and so skips the smoke.
    # !cancelled(), not always(): a cancelled run shouldn't start a 30-min sweep.
    if: ${{ !cancelled() && needs.publish-happ.outputs.releaseId != '' && needs.updater-manifests.result != 'failure' }}
    uses: ./.github/workflows/release-smoke.yaml
    with:
      release: ${{ needs.publish-happ.outputs.releaseId }}
      # Only here, and only over phase 2: a hand-dispatched release-smoke must
      # answer red for everything, and no switch may soften phase 1.
      static-checks-advisory: true
    # Explicit, not inherit: the caller holds Apple signing credentials.
    secrets:
      GIT_PAT: ${{ secrets.GIT_PAT }}
