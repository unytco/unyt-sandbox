name: "release-tauri-app"
on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+-rc.*"

jobs:
  publish-happ:
    permissions:
      contents: write
    runs-on: ubuntu-22.04
    outputs:
      releaseId: ${{ steps.create-release.outputs.id }}
      appVersion: ${{ steps.version.outputs.APP_VERSION }}
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GIT_PAT }}
          submodules: recursive
          # Full history so a UI (patch) release can read the parent tag's submodule pointer and
          # diff the DNA source between the parent commit and this one (scripts/inherit-ui-release.sh).
          fetch-depth: 0

      - name: Install nix
        uses: cachix/install-nix-action@v27
        with:
          github_access_token: ${{ secrets.GIT_PAT }}
          nix_path: nixpkgs=channel:nixos-24.05

      - uses: cachix/cachix-action@v15
        with:
          name: holochain-ci

      - uses: cachix/cachix-action@v15
        with:
          name: darksoil-studio

      - name: Assert version contract (tag == src-tauri Cargo.toml == tauri.conf.json)
        id: version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          APP_VERSION="$(bash scripts/check-version-contract.sh "$TAG")"
          echo "APP_VERSION=$APP_VERSION" >> "$GITHUB_OUTPUT"

      - name: Resolve release kind (tag patch → migration | UI)
        id: kind
        env:
          TAG: ${{ github.ref_name }}
        run: bash scripts/release-kind.sh "$TAG" >> "$GITHUB_OUTPUT"

      - name: Build DNA + happ (migration release, vM.m.0)
        if: steps.kind.outputs.kind == 'migration'
        run: |
          cd unyt && nix develop --no-update-lock-file --accept-flake-config --command bash -c "make package"

      - name: Inherit lineage happ + repack UI (UI release, vM.m.p)
        if: steps.kind.outputs.kind == 'ui'
        env:
          GH_TOKEN: ${{ secrets.GIT_PAT }}
          TAG: ${{ github.ref_name }}
          PARENT_TAG: ${{ steps.kind.outputs.parent_tag }}
        run: bash scripts/inherit-ui-release.sh "$TAG" "$PARENT_TAG"

      - name: Get Changelog Content
        id: changelog
        run: |
          VERSION="${{ steps.version.outputs.APP_VERSION }}"
          awk -v ver="$VERSION" '
            $0 ~ "^## \\[" ver "\\]" {p=1; next}
            p && /^## \[/ {exit}
            p {print}
          ' unyt/CHANGELOG.md > release_notes.txt
          echo "notes<<EOF" >> $GITHUB_OUTPUT
          cat release_notes.txt >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - id: create-release
        uses: ncipollo/release-action@v1
        with:
          allowUpdates: true
          # Fail the release if any declared artifact is missing — keeps the manifest honest so a
          # declared-but-unbuilt artifact (e.g. a DNA the repo no longer produces) can't slip through.
          artifactErrorsFailBuild: true
          artifacts: |
            unyt/workdir/unyt.happ
            unyt/workdir/unyt.webhapp
            unyt/dnas/alliance/workdir/alliance.dna
          body: ${{ steps.changelog.outputs.notes }}
          # Tag the release with the EXACT pushed tag so an -rc.* push stays an RC release (never the
          # stable vM.m.p shape the router accepts); the version contract already asserts its core
          # equals Cargo.toml. APP_VERSION (the stripped core) still names the changelog + assets.
          name: Unyt Sandbox ${{ github.ref_name }}
          tag: ${{ github.ref_name }}
          prerelease: true
          draft: true

  release-tauri-app:
    needs: publish-happ
    strategy:
      fail-fast: false
      matrix:
        config:
          - platform: macos-latest
            args: "--target aarch64-apple-darwin"
            arc_factor: default
          - platform: macos-latest
            args: "--target x86_64-apple-darwin"
            arc_factor: default
          - platform: ubuntu-22.04
            args: "--bundles deb,appimage"
            arc_factor: default
          - platform: windows-latest
            args: ""
            arc_factor: default
          # - platform: macos-latest
          #   args: "--target aarch64-apple-darwin"
          #   arc_factor: "zero"
          # - platform: macos-latest
          #   args: "--target x86_64-apple-darwin"
          #   arc_factor: "zero"
          # - platform: ubuntu-22.04
          #   args: "--bundles deb,appimage"
          #   arc_factor: "zero"
          # - platform: windows-latest
          #   args: ""
          #   arc_factor: "zero"
    env:
      MACOSX_DEPLOYMENT_TARGET: 10.13
      HOLOCHAIN_ARC_FACTOR: ${{ matrix.config.arc_factor != 'default' &&
        matrix.config.arc_factor || '' }}
      CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "16"
      CARGO_PROFILE_RELEASE_LTO: "false"
      # The base URL of the migration router the shipped app polls for BOTH update channels
      # (mandatory migration banner + dismissible build-update notice). Vite embeds it at build
      # time (VITE_ prefix → import.meta.env); empty → every check short-circuits to "unreachable"
      # and neither channel can ever appear. Defined here so the guard step can assert it and the
      # build step passes it through. A public HTTPS endpoint, not a credential.
      VITE_MIGRATION_SERVICE_URL: https://migration.unyt.dev
    permissions: write-all

    runs-on: ${{ matrix.config.platform }}
    steps:
      - name: Support longpaths
        if: matrix.config.platform != 'ubuntu-22.04'
        run: git config --system core.longpaths true

      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GIT_PAT }}
          submodules: recursive
          fetch-depth: 1

      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.89.0

      - name: install x86_64 target
        if: matrix.config.args == '--target x86_64-apple-darwin'
        run: rustup target add x86_64-apple-darwin

      - name: install dependencies (ubuntu only)
        if: matrix.config.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.0-dev \
            build-essential \
            curl \
            wget \
            file \
            libssl-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            javascriptcoregtk-4.1 \
            libsoup-3.0 \
            webkit2gtk-4.1

      - name: Install jq on Windows
        if: runner.os == 'Windows'
        run: choco install -y jq

      - name: Install and prepare
        working-directory: unyt
        run: |
          yarn install

      - name: Download release of the .happ
        uses: robinraju/release-downloader@v1.10
        env:
          GITHUB_TOKEN: ${{ secrets.GIT_PAT }}
        with:
          token: ${{ secrets.GIT_PAT }}
          releaseId: ${{ needs.publish-happ.outputs.releaseId }}
          fileName: "unyt.happ"
          out-file-path: "unyt/workdir/"

      - name: Assert migration-service URL is set (no silently un-updatable build)
        shell: bash
        run: |
          [ -n "$VITE_MIGRATION_SERVICE_URL" ] || {
            echo "::error::VITE_MIGRATION_SERVICE_URL is empty — a shipped build without it can never check for updates (both channels short-circuit to 'unreachable')."
            exit 1
          }

      - name: build (${{ matrix.config.arc_factor }} arc)
        uses: tauri-apps/tauri-action@v0
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_DEV_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID_EMAIL }}
          APPLE_PASSWORD: ${{ secrets.APPLE_ID_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          GITHUB_TOKEN: ${{ secrets.GIT_PAT }}
          VITE_COMMIT_SHA: Unyt-Sandbox-${{ needs.publish-happ.outputs.appVersion }}-${{
            matrix.config.arc_factor }}-arc
          APP_VERSION: ${{ needs.publish-happ.outputs.appVersion }}
          HOLOCHAIN_ARC_FACTOR: ${{ matrix.config.arc_factor != 'default' &&
            matrix.config.arc_factor || '' }}
          UNYT_JOINING_SERVICE_URL: https://joining.unyt.dev
          VITE_CENTRALIZED_CONFIG_URL: https://config.unyt.dev
          VITE_MIGRATION_SERVICE_URL: ${{ env.VITE_MIGRATION_SERVICE_URL }}
        with:
          projectPath: unyt
          releaseId: ${{ needs.publish-happ.outputs.releaseId }}
          releaseDraft: true
          prerelease: true
          args: ${{ matrix.config.args }}
          assetNamePattern: ${{
            format('unyt_[version]_[name]_{0}-arc_[arch]_[platform][ext]',
            matrix.config.arc_factor) }}

  # Install what was just built and prove the app starts — see release-smoke.yaml.
  # Called directly (not via `workflow_run`, which only fires for workflow files
  # on the DEFAULT branch and so would silently never run on a release branch),
  # and report-only: the smoke job goes RED on a failure but nothing depends on
  # it, so it never blocks or unpublishes the release that produced the artifacts.
  smoke-test:
    needs: [publish-happ, release-tauri-app]
    # `needs` alone SKIPS this job if any matrix row failed, so a Windows build
    # failure would suppress a perfectly good Linux check. Run whenever the happ
    # job produced a release id — the Linux artifacts either exist or the
    # download step says so plainly.
    if: ${{ always() && needs.publish-happ.outputs.releaseId != '' }}
    uses: ./.github/workflows/release-smoke.yaml
    with:
      release: ${{ needs.publish-happ.outputs.releaseId }}
      report_only: true
    secrets: inherit

