name: "release-tauri-app"
on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+-rc.*" # Test: v1.0.0-rc.0

env:
  REPO_OWNER: ${{ github.repository_owner }}
  REPO_NAME: ${{ github.event.repository.name }}

jobs:
  publish-happ:
    permissions:
      contents: write
    runs-on: ubuntu-22.04
    outputs:
      releaseId: ${{ steps.create-release.outputs.id }}
      appVersion: ${{ steps.version.outputs.APP_VERSION }}
      app_variants: ${{ steps.prepare-variants.outputs.app_variants }}
    steps:
      - uses: actions/checkout@v3
        with:
          token: ${{ secrets.GIT_PAT }}
          submodules: recursive
          fetch-depth: 0

      # Single source of truth: .github/app-variants.yaml (set enabled: false to exclude)
      - name: Prepare variant list
        id: prepare-variants
        run: |
          VARIANTS_FILE=".github/app-variants.yaml"
          # Parse YAML (Ruby built-in), filter enabled != false, output JSON for jq
          ENABLED=$(ruby -r yaml -r json -e "
            list = YAML.load_file('$VARIANTS_FILE')
            list = list.select { |v| v['enabled'] != false }
            puts list.to_json
          ")
          echo "app_variants<<EOF" >> $GITHUB_OUTPUT
          echo "$ENABLED" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
          {
            echo "## Unyt network release"
            echo ""
            echo "This release builds the following app variants. The **identifier** is the network seed."
            echo ""
            echo "| Unyt Network |         Network Seed           |"
            echo "|--------------|--------------------------------|"
            echo "$ENABLED" | jq -r '.[] | "| \(.product_name) | `\(.identifier)` |"'
            echo ""
            echo "---"
            echo ""
          } > variants_note.txt
          echo "variants_note<<EOF" >> $GITHUB_OUTPUT
          cat variants_note.txt >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Install nix
        uses: cachix/install-nix-action@v27
        with:
          github_access_token: ${{ secrets.GIT_PAT }}
          nix_path: nixpkgs=channel:nixos-24.05

      - uses: cachix/cachix-action@v15
        with:
          name: holochain-ci

      - uses: cachix/cachix-action@v15
        with:
          name: darksoil-studio

      - name: Install and test
        run: |
          nix-store --gc
          nix develop --no-update-lock-file --accept-flake-config --command bash -c "make package"

      - name: Retrieve version
        run: |
          echo "APP_VERSION=$(cat src-tauri/tauri.conf.json | grep -oP '(?<="version": ")[^"]*')" >> $GITHUB_OUTPUT
        id: version

      - name: Get Changelog Content
        id: changelog
        run: |
          VERSION="${{ steps.version.outputs.APP_VERSION }}"
          awk -v ver="$VERSION" '
            $0 ~ "^## \\[" ver "\\]" {p=1; next}
            p && /^## \[/ {exit}
            p {print}
          ' unyt/CHANGELOG.md > release_notes.txt
          echo "notes<<EOF" >> $GITHUB_OUTPUT
          echo "${{ steps.prepare-variants.outputs.variants_note }}" >> $GITHUB_OUTPUT
          cat release_notes.txt >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - id: create-release
        uses: ncipollo/release-action@v1
        with:
          allowUpdates: true
          artifacts: |
            unyt/workdir/unyt.happ
            unyt/workdir/unyt.webhapp
            unyt/dnas/alliance/workdir/alliance.dna
            unyt/dnas/agent_details/workdir/agent_details.dna
          body: ${{ steps.changelog.outputs.notes }}
          name: Unyt Sandbox v${{ steps.version.outputs.APP_VERSION }}
          tag: v${{ steps.version.outputs.APP_VERSION }}
          prerelease: true
          draft: true

  release-tauri-app:
    needs: publish-happ
    strategy:
      fail-fast: false
      matrix:
        # From .github/app-variants.yaml (set enabled: false to exclude)
        app_variant: ${{ fromJson(needs.publish-happ.outputs.app_variants) }}
        config:
          - platform: macos-latest
            args: "--target aarch64-apple-darwin"
            arc_factor: default
          - platform: macos-latest
            args: "--target x86_64-apple-darwin"
            arc_factor: default
          - platform: ubuntu-22.04
            args: "--bundles deb,appimage"
            arc_factor: default
          - platform: windows-latest
            args: ""
            arc_factor: default
          - platform: macos-latest
            args: "--target aarch64-apple-darwin"
            arc_factor: "zero"
          - platform: macos-latest
            args: "--target x86_64-apple-darwin"
            arc_factor: "zero"
          - platform: ubuntu-22.04
            args: "--bundles deb,appimage"
            arc_factor: "zero"
          - platform: windows-latest
            args: ""
            arc_factor: "zero"
    env:
      MACOSX_DEPLOYMENT_TARGET: 10.13
      HOLOCHAIN_ARC_FACTOR: ${{ matrix.config.arc_factor != 'default' && matrix.config.arc_factor || '' }}
      PRODUCT_NAME: ${{ matrix.app_variant.product_name }}
      TAURI_PRODUCT_NAME: ${{ matrix.app_variant.product_name }}
      TAURI_APP_IDENTIFIER: ${{ matrix.app_variant.identifier }}
      TAURI_APP_ID_PREFIX: ${{ matrix.app_variant.id }}
      TAURI_DEEP_LINK_SCHEME: ${{ matrix.app_variant.id }}
      TAURI_SPLASHSCREEN_TITLE: ${{ matrix.app_variant.product_name }} Loading
      TAURI_APP_VARIANT: ${{ matrix.app_variant.id }}
    permissions: write-all

    runs-on: ${{ matrix.config.platform }}
    steps:
      - name: Support longpaths
        if: matrix.config.platform != 'ubuntu-22.04'
        run: git config --system core.longpaths true

      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      # Checks out a copy of your repository on the ubuntu-latest machine
      - uses: actions/checkout@v3
        with:
          token: ${{ secrets.GIT_PAT }}
          submodules: recursive
          fetch-depth: 0

      - name: setup node
        uses: actions/setup-node@v1
        with:
          node-version: 20

      - name: install Rust stable
        uses: actions-rs/toolchain@v1
        with:
          override: true
          toolchain: 1.88.0

      - name: install x86_64 target
        if: matrix.config.args == '--target x86_64-apple-darwin'
        run: rustup target add x86_64-apple-darwin

      - name: install wasm32-unknown-unknown target
        run: rustup target add wasm32-unknown-unknown

      - name: install Go stable
        uses: actions/setup-go@v4
        with:
          go-version: "stable"

      - name: install dependencies (ubuntu only)
        if: matrix.config.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.0-dev \
            build-essential \
            curl \
            wget \
            file \
            libssl-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            javascriptcoregtk-4.1 \
            libsoup-3.0 \
            webkit2gtk-4.1

      - name: Install jq on Windows
        if: runner.os == 'Windows'
        run: choco install -y jq

      - name: Install and prepare
        run: |
          yarn install

      - name: Prepare app variant (config + icons)
        run: |
          chmod +x scripts/generate-tauri-config.sh scripts/copy-app-icons.sh
          bash scripts/generate-tauri-config.sh
          bash scripts/copy-app-icons.sh

      - name: Retrieve version
        shell: bash
        run: |
          echo "APP_VERSION=$(jq -r '.version' src-tauri/tauri.conf.json)" >> $GITHUB_OUTPUT
        id: version

      - name: Download release of the .happ
        uses: robinraju/release-downloader@v1.10
        env:
          GITHUB_TOKEN: ${{ secrets.GIT_PAT }}
        with:
          token: ${{ secrets.GIT_PAT }}
          releaseId: ${{ needs.publish-happ.outputs.releaseId }}
          fileName: "unyt.happ"
          out-file-path: "workdir/"

      - name: build (${{ matrix.config.arc_factor }} arc)
        uses: tauri-apps/tauri-action@v0
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_DEV_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID_EMAIL }}
          APPLE_PASSWORD: ${{ secrets.APPLE_ID_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          GITHUB_TOKEN: ${{ secrets.GIT_PAT }}
          VITE_SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          VITE_COMMIT_SHA: ${{ env.PRODUCT_NAME }}-${{ steps.version.outputs.APP_VERSION }}-sandbox-${{ matrix.config.arc_factor }} # this is the tag that will be added to sentry
          APP_VERSION: ${{ steps.version.outputs.APP_VERSION }}
          HOLOCHAIN_ARC_FACTOR: ${{ matrix.config.arc_factor != 'default' && matrix.config.arc_factor || '' }}
          VITE_IS_RIDESHARE_RELEASE: ${{ matrix.app_variant.id == 'rideshare' && 'true' || 'false' }}
          VITE_APP_NAME: ${{ matrix.app_variant.product_name }}
          VITE_IS_CIRCULO_RELEASE: ${{ matrix.app_variant.id == 'circulo' && 'true' || 'false' }}
        with:
          releaseId: ${{ needs.publish-happ.outputs.releaseId }}
          releaseDraft: true
          includeUpdaterJson: ${{ matrix.config.arc_factor == 'default' && false || true }} # Upload updater JSON for zero arc
          updaterJsonPreferNsis: true
          prerelease: true
          args: ${{ matrix.config.args }}
          assetNamePattern: ${{ format('unyt_[version]_[name]_{0}-arc_[arch]_[platform][ext]', matrix.config.arc_factor) }}

