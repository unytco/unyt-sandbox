name: "zz-TEMPORARY-load-proving"

# TEMPORARY. One question, on each platform: does the released app launch and put
# a visible first screen in front of a user? Delete this file and
# scripts/smoke/load-proving/ together and the repo is as it was.
#
# Independent of release-smoke.yaml on purpose — it answers a different question
# (does the artifact install and stay up) and this must not be able to break it.
#
# THE MOST VALUABLE OUTPUT IS THE SCREENSHOTS, which upload whatever the verdict.
# The second most valuable is the pre-launch control frame each lane takes before
# the app exists: if that frame already passes for the app, the capture path is
# photographing the desktop and every verdict that job could produce is void.
#
# Every lane photographs the app's own window and says what the frame was.
# macOS is the one that may not manage it: without the TCC Screen Recording
# grant a capture returns the desktop with the app omitted rather than failing,
# so that lane checks whether it has the grant, tries, and falls back to the
# window list — reporting WINDOW-ONLY and saying webview paint is unverified —
# whenever the frame it got is not the app's own screen.
#
# ONE ARTIFACT PER LANE, not one per platform: the .deb and the AppImage install
# differently, and so do the NSIS .exe and the .msi.
#
# A lane that cannot launch, or whose capture path cannot be trusted, reports
# UNTRUSTED or CANNOT PROVE and goes red. It never skips, and it is never green.
# macOS is the one exception and says so on the line: it has a second way to
# answer, so it drops to WINDOW-ONLY — green, and explicit that paint is
# unverified — rather than going red for a photograph it could not take.
on:
  push:
    branches: [fix/release-pipeline-post-0.7-cutover]
  workflow_dispatch:
    inputs:
      release:
        description: "Release id or tag. Empty means the default below."
        required: false
        type: string

concurrency:
  group: load-proving-${{ github.ref }}
  cancel-in-progress: true

env:
  # ONE home for the id: `inputs.release` is empty on a push trigger and empty
  # when a dispatch leaves the box alone, so the default lives here and the input
  # has none of its own to drift from.
  RELEASE: ${{ inputs.release || '370871646' }}

jobs:
  linux:
    name: "linux first screen (${{ matrix.kind }})"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - kind: deb
            suffix: linux.deb
          - kind: appimage
            suffix: linux.AppImage
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GIT_PAT }}
          fetch-depth: 1

      # Before anything trusts a verdict: can it still come out red? Both suites,
      # because the analyser decides what a frame is and the other decides what a
      # verdict does to the job — and the second is the one that makes a job green.
      - name: Can the verdicts still fail?
        run: |
          python3 scripts/smoke/load-proving/screenshot-stats.py --self-test
          bash scripts/smoke/load-proving/test-proving.sh

      - name: Install a display and a screen grabber
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb x11-utils xdotool imagemagick

      - name: Download the released artifact
        env:
          GH_TOKEN: ${{ secrets.GIT_PAT }}
          SUFFIX: ${{ matrix.suffix }}
        run: |
          artifact="$(bash scripts/smoke/download-release-asset.sh \
            "$RELEASE" "$SUFFIX" "$RUNNER_TEMP/artifacts")"
          echo "ARTIFACT=$artifact" >> "$GITHUB_ENV"

      - name: Launch it and photograph what a user would see
        run: |
          rc=0
          bash scripts/smoke/load-proving/prove-linux.sh \
            "$ARTIFACT" "$RUNNER_TEMP/shots" >"$RUNNER_TEMP/verdict.txt" || rc=$?
          bash scripts/smoke/load-proving/publish-verdict.sh \
            "$RUNNER_TEMP/verdict.txt" "linux ${{ matrix.kind }}" "$rc"

      # THE POINT OF THE JOB. Always, and before the step above can fail the run.
      - name: Upload every frame
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: load-proving-linux-${{ matrix.kind }}
          path: ${{ runner.temp }}/shots
          # `error`, not `warn`: the frames are what this lane produces, so an
          # empty artifact is itself a finding.
          if-no-files-found: error

  # THE LANE THAT MAY PROVE LESS, and its verdict says which it managed. The
  # design assumed a runner cannot be granted Screen Recording — without it
  # `screencapture` returns the desktop with the app's windows omitted rather
  # than failing — but the first run read our own window's TITLE, which is
  # exactly what that grant withholds. So this lane now tries a window-scoped
  # capture and reports PROVEN when the frame is the app's own screen, and falls
  # back to the window list (WINDOW-ONLY) when it is not. See prove-macos.sh.
  macos:
    name: "macos first screen or window (${{ matrix.arch }})"
    # PINNED, not macos-latest: the label moved to macOS 26 and its capture and
    # redaction rules differ, so a lane that answers today would change answer
    # without a commit.
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: aarch64
            suffix: aarch64_darwin.dmg
          - runner: macos-15-intel
            arch: x86_64
            suffix: x64_darwin.dmg
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GIT_PAT }}
          fetch-depth: 1

      - name: Can the verdicts still fail?
        run: |
          python3 scripts/smoke/load-proving/screenshot-stats.py --self-test
          bash scripts/smoke/load-proving/test-proving.sh

      - name: Download the released artifact
        env:
          GH_TOKEN: ${{ secrets.GIT_PAT }}
          SUFFIX: ${{ matrix.suffix }}
        run: |
          dmg="$(bash scripts/smoke/download-release-asset.sh \
            "$RELEASE" "$SUFFIX" "$RUNNER_TEMP/artifacts")"
          echo "DMG=$dmg" >> "$GITHUB_ENV"

      - name: Launch it and ask the window server what it put on screen
        run: |
          rc=0
          bash scripts/smoke/load-proving/prove-macos.sh \
            "$DMG" "$RUNNER_TEMP/shots" >"$RUNNER_TEMP/verdict.txt" || rc=$?
          bash scripts/smoke/load-proving/publish-verdict.sh \
            "$RUNNER_TEMP/verdict.txt" "macos ${{ matrix.arch }}" "$rc"

      # Both kinds here: shots/verdict holds window-scoped frames when the lane
      # managed them, and shots/context the whole-screen ones, which are only
      # ever evidence about the runner.
      - name: Upload every frame
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: load-proving-macos-${{ matrix.arch }}
          path: ${{ runner.temp }}/shots
          # `warn` only here: this lane can still answer with the window list, so
          # a run with nothing capturable is a real outcome rather than a fault.
          if-no-files-found: warn

  # THREE JOBS, NOT FOUR, and the asymmetry is deliberate. The two images answer
  # an OS-VERSION question, and they have already answered it identically —
  # 50.00% dominant over 1847 distinct on windows-2022 against 50.86% over 1881
  # on windows-2025, for the same frame of the same installer. The .msi answers
  # an ARTIFACT question instead: a per-machine install into Program Files rather
  # than a per-user one under %LOCALAPPDATA%, registered per-machine, with its
  # own product version. Running it on both images would re-measure the OS delta
  # at the cost of a runner rather than cover anything the .exe pair does not, so
  # it runs on the newer image alone — where a policy or path difference would
  # show up first.
  #
  # UNCONDITIONAL, unlike release-smoke.yaml's inventory-gated MSI steps: this
  # lane is pointed at one pinned release that ships one. A release without an
  # .msi reds this job at the download step, which prints the assets it does
  # have — a true answer, and a louder one than a skip.
  windows:
    name: "windows first screen (${{ matrix.kind }} on ${{ matrix.runner }})"
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-2022
            kind: nsis
            suffix: x64_windows.exe
          - runner: windows-2025
            kind: nsis
            suffix: x64_windows.exe
          - runner: windows-2025
            kind: msi
            suffix: x64_windows.msi
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GIT_PAT }}
          fetch-depth: 1

      # The third suite is Windows-only because the lane it tests is: it decides
      # which command installs an artifact and where Windows recorded it, and
      # `powershell` (not pwsh) is what runs that file.
      - name: Can the verdicts still fail?
        shell: bash
        run: |
          python scripts/smoke/load-proving/screenshot-stats.py --self-test
          bash scripts/smoke/load-proving/test-proving.sh
          powershell -NoProfile -ExecutionPolicy Bypass \
            -File scripts/smoke/load-proving/prove-windows.ps1 -SelfTest

      - name: Download the released installer
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GIT_PAT }}
          SUFFIX: ${{ matrix.suffix }}
        run: |
          # Git Bash: `mkdir -p 'D:\a\_temp/x'` makes ONE dir with backslashes.
          out="${RUNNER_TEMP//\\//}/artifacts"
          installer="$(bash scripts/smoke/download-release-asset.sh \
            "$RELEASE" "$SUFFIX" "$out")"
          echo "INSTALLER=$installer" >> "$GITHUB_ENV"

      # `powershell`, NOT `pwsh`: System.Drawing is a .NET Framework assembly and
      # is absent from PowerShell 7's shared framework, so the capture only exists
      # here. `-File` is the only form whose exit status is the script's own.
      - name: Launch it and photograph what a user would see
        shell: powershell
        run: |
          # GitHub's powershell shell sets ErrorActionPreference=stop, under which
          # a native command's stderr can terminate the step before its verdict is
          # read — and an unread verdict is the one outcome this must not have.
          $ErrorActionPreference = 'Continue'
          $verdict = & powershell -NoProfile -ExecutionPolicy Bypass `
            -File scripts/smoke/load-proving/prove-windows.ps1 `
            -Artifact $env:INSTALLER -Shots "$env:RUNNER_TEMP\shots"
          # WriteAllLines, not `>`: Windows PowerShell writes UTF-16 and
          # Set-Content -Encoding utf8 adds a BOM, and the reader is bash.
          [System.IO.File]::WriteAllLines(
            (Join-Path $env:RUNNER_TEMP 'verdict.txt'),
            [string[]]@($verdict | ForEach-Object { "$_" }))
          "PROVE_RC=$LASTEXITCODE" | Add-Content -LiteralPath $env:GITHUB_ENV

      # Its own step, and always: the verdict is what colours this job, so it must
      # be read even when the step above died before it could say anything. `bash`
      # rather than a second PowerShell copy of publish-verdict.sh — one home for
      # the mapping, and Git Bash is on the PATH of every Windows runner.
      - name: The verdict
        if: always()
        shell: bash
        run: |
          bash scripts/smoke/load-proving/publish-verdict.sh \
            "${RUNNER_TEMP//\\//}/verdict.txt" \
            "windows ${{ matrix.kind }} ${{ matrix.runner }}" "${PROVE_RC:-99}"

      # The kind is in the name as well as the image: two jobs on one image would
      # otherwise collide, and the upload of the second would fail the run.
      - name: Upload every frame
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: load-proving-windows-${{ matrix.kind }}-${{ matrix.runner }}
          path: ${{ runner.temp }}/shots
          if-no-files-found: error
